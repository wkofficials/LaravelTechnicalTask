; Supervisor program for the ImportFlow queue workers.
; Install: copy to /etc/supervisor/conf.d/, adjust paths/user, then
;   sudo supervisorctl reread && sudo supervisorctl update
; After every deploy:  php artisan queue:restart   (workers exit gracefully and Supervisor starts fresh ones)
;
; Why these numbers:
; - --timeout=3600 matches ProcessExcelImport::$timeout; DB_QUEUE_RETRY_AFTER (3900) must stay larger.
; - --tries is NOT set here: each job defines its own tries/backoff.
; - --max-time / --max-jobs recycle long-lived workers so memory can't creep.
; - --memory=512 restarts a worker that grows past 512 MB (100k-row imports measured well below that).
; - stopwaitsecs lets a running chunk finish on shutdown instead of being killed mid-transaction
;   (a killed chunk is safe anyway — it rolls back and is retried — but this avoids the retry delay).

[program:importflow-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/importflow/artisan queue:work database --sleep=3 --timeout=3600 --max-time=3600 --max-jobs=500 --memory=512
directory=/var/www/importflow
user=www-data
numprocs=2
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=3700
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/importflow/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
